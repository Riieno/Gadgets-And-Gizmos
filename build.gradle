tasks.register('bundledJar', Jar) {
    group = 'build'
    description = 'Assembles the distribution wrapper with freshly built addon and library jars.'
    archiveBaseName = distribution_name
    archiveVersion = artifact_version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn tasks.named('jar')
    from('src/bundled/resources') {
        filesMatching(['META-INF/neoforge.mods.toml', 'META-INF/jarjar/metadata.json']) {
            expand bundledReplaceProperties
        }
    }
    from(tasks.named('jar').flatMap { it.archiveFile }) {
        into 'META-INF/jarjar'
        rename { "${mod_id}-${mod_version}.jar" }
    }
    from(libraryJarFile) {
        into 'META-INF/jarjar'
        rename { "${library_mod_id}-${mod_version}.jar" }
    }
}
if(local.modrinth_path!=null && !local.modrinth_path.isEmpty() && file(local.modrinth_path).exists()) {
    tasks.register('copyBundledJarToModrinth') {
        group = 'build'
        description = 'Copies the bundled jar into the Modrinth Create addon dev profile mods directory.'
        dependsOn tasks.named('bundledJar')
        def modrinthModsDir = file(local.modrinth_path)
        inputs.file(tasks.named('bundledJar').flatMap { it.archiveFile })
        outputs.file(modrinthModsDir.toPath().resolve(tasks.named('bundledJar').get().archiveFileName.get()).toFile())
        doLast {
            modrinthModsDir.mkdirs()
            fileTree(modrinthModsDir) {
                include "${archive_name}-*.jar"
                include "${distribution_name}-*.jar"
            }.each { File staleJar ->
                if (!staleJar.name.equals(tasks.named('bundledJar').get().archiveFileName.get())) {
                    staleJar.delete()
                }
            }

            File sourceJar = tasks.named('bundledJar').get().archiveFile.get().asFile
            File targetJar = new File(modrinthModsDir, tasks.named('bundledJar').get().archiveFileName.get())
            File tempJar = new File(modrinthModsDir, "${targetJar.name}.tmp")
            try {
                java.nio.file.Files.copy(sourceJar.toPath(), tempJar.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                try {
                    java.nio.file.Files.move(tempJar.toPath(), targetJar.toPath(),
                            java.nio.file.StandardCopyOption.REPLACE_EXISTING,
                            java.nio.file.StandardCopyOption.ATOMIC_MOVE)
                } catch (java.nio.file.AtomicMoveNotSupportedException ignored) {
                    java.nio.file.Files.move(tempJar.toPath(), targetJar.toPath(),
                            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
            } catch (java.nio.file.AccessDeniedException lockedJar) {
                tempJar.delete()
                logger.warn("Could not update locked Modrinth profile jar '{}'. "
                        + "The built artifact is still available at '{}'.",
                        targetJar, sourceJar)
            }
        }
    }
}

tasks.named('build') {
