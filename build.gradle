sourceSets {
    docgen {
        java.srcDir 'src/docgen/java'
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

// Run presentation regressions in an isolated server without packaging test classes
if(providers.gradleProperty('acc_presentation_validation').map { it.toBoolean() }.getOrElse(false)){
    dependencies { additionalRuntimeClasspath files(configurations.bundledSqlite) }
    sourceSets {
        accPresentationTest {
            java.srcDir 'src/containerGameTest/java'
            resources.srcDir 'src/containerGameTest/resources'
            compileClasspath += sourceSets.main.output + configurations.compileClasspath
            runtimeClasspath += output + compileClasspath + configurations.runtimeClasspath
        }
    }
    neoForge {
        mods {
            "${mod_id}" { sourceSet(sourceSets.accPresentationTest) }
        }
        runs {
            accPresentationTest {
                type = 'gameTestServer'
                gameDirectory = file('run/acc-presentation-tests')
                systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
                systemProperty 'acc.presentation.graph', providers.gradleProperty('acc_presentation_graph').getOrElse('')
            }
            shipDoorTest {
                type = 'gameTestServer'
                gameDirectory = file('run/ship-door-tests')
                systemProperty 'neoforge.enabledGameTestNamespaces', 'createthrusters_ship_doors'
            }
        }
    }

    if(providers.gradleProperty('rendering_validation').map { it.toBoolean() }.getOrElse(false)){
        def renderingWorld = file('run/rendering-validation/saves/Optimization Validation')
        def prepareRenderingWorld = tasks.register('prepareRenderingValidation', Copy) {
            from file('run/acc-presentation-tests/world')
            into renderingWorld
            onlyIf { !new File(renderingWorld, 'level.dat').isFile() }
            doFirst {
                if(!file('run/acc-presentation-tests/world/level.dat').isFile()){
                    throw new GradleException('Run runAccPresentationTest before rendering validation.')
                }
            }
        }
        neoForge.runs.client {
            gameDirectory = file('run/rendering-validation')
            programArguments.addAll('--quickPlaySingleplayer', 'Optimization Validation')
            systemProperty 'gadgetsngizmos.renderingValidation', 'true'
            systemProperty 'gadgetsngizmos.renderingValidationResult', file('run/rendering-validation/result.txt').absolutePath
        }
        tasks.named('runClient') {
            dependsOn prepareRenderingWorld
            doFirst { file('run/rendering-validation/result.txt').text = 'RUNNING' }
        }
    }

    if(providers.gradleProperty('digisable_validation').map { it.toBoolean() }.getOrElse(false)){
        def validationDir = file(providers.gradleProperty('digisable_validation_directory').getOrElse('run/digisable-validation'))
        def validationWorld = new File(validationDir, 'saves/Digisable Validation')
        def prepareDigisableValidation = tasks.register('prepareDigisableValidation', Copy) {
            from file('run/acc-presentation-tests/world')
            include 'level.dat'
            into validationWorld
            onlyIf { !new File(validationWorld, 'level.dat').isFile() }
            doFirst {
                if(!file('run/acc-presentation-tests/world/level.dat').isFile())
                    throw new GradleException('Run runAccPresentationTest before Digisable validation.')
            }
        }
        neoForge.runs.client {
            gameDirectory = validationDir
            programArguments.addAll('--quickPlaySingleplayer', 'Digisable Validation')
            systemProperty 'gadgetsngizmos.digisableValidation', 'true'
            systemProperty 'gadgetsngizmos.digisableValidationResult', new File(validationDir, 'result.txt').absolutePath
        }
        tasks.named('runClient') {
            dependsOn prepareDigisableValidation
            doFirst {
                new File(validationDir, 'result.txt').text = 'RUNNING'
                def options = new File(validationDir, 'options.txt')
                if(!options.isFile()) options.text = 'onboardAccessibility:false\npauseOnLostFocus:false\nrenderDistance:6\nmaxFps:60\n'
            }
            doLast {
                def result = new File(validationDir, 'result.txt').text
                if(!result.startsWith('PASSED:')) throw new GradleException(result)
            }
        }
    }
}

def ccDocsCatalogue = layout.projectDirectory.file(
        'src/main/resources/data/computercraft/lua/rom/modules/main/'
                + 'gadgetsandgizmos/docs_catalog.lua')

tasks.named('compileDocgenJava') {
    dependsOn tasks.named('classes')
}

// Expose nested runtime libraries to the standalone documentation exporter
def documentationLibraries = layout.buildDirectory.dir('documentation-libraries')
tasks.register('prepareDocumentationLibraries', Copy) {
    if(librarySourceAvailable) dependsOn buildLibrary
    from zipTree(localJars.find { it.name.startsWith("create-${minecraft_version}-") })
    from({ zipTree(libraryJarFile) })
    include 'META-INF/jarjar/*.jar'
    into documentationLibraries
}

tasks.register('generateGraphWebCatalog', JavaExec) {
    group = 'documentation'
    description = 'Exports resolved graph nodes and the library browser API for the website.'
    dependsOn tasks.named('docgenClasses')
    dependsOn tasks.named('prepareDocumentationLibraries')
    classpath = sourceSets.docgen.runtimeClasspath + sourceSets.main.runtimeClasspath + fileTree(documentationLibraries) { include '**/*.jar' }
    mainClass = 'com.rieno.gadgetsandgizmos.neoforge.GenerateGraphWebCatalog'
    args providers.gradleProperty('web_catalog_output').getOrElse(
            layout.projectDirectory.dir('src/main/resources/assets/createthrusters/web/graph-editor').asFile.absolutePath)
}

tasks.register('generateComputerCraftDocs', JavaExec) {
    group = 'documentation'
    description = 'Regenerates the checked-in CC:Tweaked Lua documentation catalogue.'
    dependsOn tasks.named('docgenClasses')
    classpath = sourceSets.docgen.runtimeClasspath
    mainClass = 'com.rieno.gadgetsandgizmos.tools.GenerateComputerCraftDocs'
    args ccDocsCatalogue.asFile.absolutePath
    outputs.file ccDocsCatalogue
}

tasks.register('verifyComputerCraftDocs', JavaExec) {
    mustRunAfter tasks.named('generateComputerCraftDocs')
    group = 'verification'
    description = 'Fails when CC:Tweaked documentation is missing or stale.'
    dependsOn tasks.named('docgenClasses')
    classpath = sourceSets.docgen.runtimeClasspath
    mainClass = 'com.rieno.gadgetsandgizmos.tools.GenerateComputerCraftDocs'
    args '--check', ccDocsCatalogue.asFile.absolutePath
    inputs.files sourceSets.main.output, sourceSets.docgen.output
    inputs.file ccDocsCatalogue
}

tasks.withType(JavaCompile).configureEach {
    if (librarySourceAvailable) {
        dependsOn buildLibrary
    }
    dependsOn validateLocalDependencies
    options.encoding = 'UTF-8'
}

tasks.named('check') {
    dependsOn validateMixinConfig
    dependsOn tasks.named('verifyComputerCraftDocs')
}

tasks.named('jar', Jar) {
    archiveBaseName = archive_name
}

tasks.register('bundledJar', Jar) {
    group = 'build'
    description = 'Assembles the distribution wrapper with freshly built addon and library jars.'
    archiveBaseName = distribution_name
    archiveVersion = artifact_version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn tasks.named('jar')
    if (librarySourceAvailable) {
        dependsOn buildLibrary
    }
    from('src/bundled/resources') {
        filesMatching(['META-INF/neoforge.mods.toml', 'META-INF/jarjar/metadata.json']) {
            expand bundledReplaceProperties
        }
    }
    from(tasks.named('jar').flatMap { it.archiveFile }) {
        into 'META-INF/jarjar'
        rename { "${mod_id}-${mod_version}.jar" }
    }
    from(libraryJarFile) {
        into 'META-INF/jarjar'
        rename { "${library_mod_id}-${library_mod_version}.jar" }
    }
}
tasks.named('build') {
    dependsOn tasks.named('bundledJar')
}

// Package the checked-in wiki snapshot with this addon version without any network access
def wikiBundleDir = layout.buildDirectory.dir('generated/bundled-wiki')
def bundleWikiDocumentation = tasks.register('bundleWikiDocumentation', Sync) {
    from('src/main/wiki')
    include '**/*.md', 'images/**'
    into wikiBundleDir
    inputs.property('documentationVersion', mod_version)
    doLast {
        def pages = fileTree('src/main/wiki') { include '*.md' }.files.collect { source ->
            def id = source.name.substring(0, source.name.length() - 3)
            [id: id, title: id.replace('-', ' ').replace('_', ' '), file: source.name]
        }.sort { first, second ->
            (first.id == 'Home' ? 0 : 1) <=> (second.id == 'Home' ? 0 : 1) ?: first.title.compareToIgnoreCase(second.title)
        }
        new File(wikiBundleDir.get().asFile, 'index.json').setText(JsonOutput.prettyPrint(JsonOutput.toJson(
                [formatVersion: 1, version: mod_version, pages: pages])), 'UTF-8')
    }
}

processResources {
    dependsOn bundleWikiDocumentation
    from(wikiBundleDir) { into 'assets/createthrusters/documentation' }
    inputs.properties addonReplaceProperties
    inputs.files(configurations.bundledSqlite)
    from(configurations.bundledSqlite) {
        into 'META-INF/optional-libs'
        rename { 'sqlite-jdbc-bundled.jar' }
    }
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand addonReplaceProperties
    }
    // Package the supplied 3D artwork with a valid Minecraft resource path
    filesMatching('assets/createthrusters/textures/gui/modals/target_modal_3D.png') {
        name = 'target_modal_3d.png'
    }
}
