        new java.util.zip.ZipFile(sodiumJar).withCloseable { zip ->
            sodiumCore = zip.entries().find { entry -> entry.name.startsWith('META-INF/jarjar/') && entry.name.endsWith('-mod.jar') }?.name
        }
        def sodiumCoreFile = sodiumCore == null ? sodiumJar : file("build/widget-shader-runtime/${new File(sodiumCore).name}")
        def extractShaderRuntime = tasks.register('extractWidgetShaderRuntime', Copy) {
            if(sodiumCore != null){
                from zipTree(sodiumJar)
                include sodiumCore
                eachFile { path = name }
                includeEmptyDirs = false
                into sodiumCoreFile.parentFile
            }
        }
        // Join Sodium's platform and core classes for the development mod classpath
        def prepareShaderRuntime = tasks.register('prepareWidgetShaderRuntime', Jar) {
            dependsOn extractShaderRuntime
            archiveFileName = 'sodium-widget-validation.jar'
            destinationDirectory = layout.buildDirectory.dir('widget-shader-runtime')
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
            from zipTree(sodiumJar)
            if(sodiumCore != null) from { zipTree(sodiumCoreFile) }
        }
        dependencies {
            runtimeOnly files(fileTree(new File(instanceDir, 'mods')) {
                include 'iris-*.jar'
            })
            runtimeOnly files(prepareShaderRuntime.flatMap { it.archiveFile })
        }
        def prepareWidgetShaders = tasks.register('prepareWidgetShaderValidation') {
