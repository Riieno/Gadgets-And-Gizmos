    if(providers.gradleProperty('flight_control_runtime').map { it.toBoolean() }.getOrElse(false)
            || providers.gradleProperty('acc_presentation_validation').map { it.toBoolean() }.getOrElse(false)){
        if(flightControlJar.isPresent()) runtimeOnly files(flightControlJar.get())
        else runtimeOnly(flightControlDependency) { transitive = false }
    }
    compileOnly files(requiredSableJar)
    compileOnly files(libraryJarFile)
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.27.0.340'
    compileOnly 'dev.emi:emi-neoforge:1.1.22+1.21.1'
    compileOnly 'me.shedaniel:RoughlyEnoughItems-api-neoforge:16.0.799'
    compileOnly 'maven.modrinth:jade:15.10.5+neoforge'
    compileOnly 'maven.modrinth:B1CBVXHX:eFcwlxhy'
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    compileOnly 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1'
    compileOnly('org.appliedenergistics:appliedenergistics2:19.2.17') { transitive = false }
    runtimeOnly selectedLocalRuntimeJars
