    mod_id: mod_id,
    mod_name: mod_name,
    mod_license: mod_license,
    mod_version: mod_version,
    mod_authors: mod_authors,
    mod_description: mod_description,
    library_mod_id: library_mod_id,
    library_mod_name: library_mod_name,
    library_mod_version: library_mod_version,
    bundled_mod_id: bundled_mod_id,
    bundled_mod_name: bundled_mod_name,
    bundled_mod_description: bundled_mod_description,
    minecraft_version: minecraft_version,
    neoforge_version: neoforge_version,
    flywheel_version: flywheel_version,
    sable_version: sable_version
]
def bundledReplaceProperties = [
    mod_group_id: mod_group_id,
    mod_id: mod_id,
    mod_name: mod_name,
    mod_license: mod_license,
    mod_version: mod_version,
    mod_authors: mod_authors,
    mod_description: mod_description,
    library_mod_id: library_mod_id,
    library_mod_name: library_mod_name,
    library_mod_version: library_mod_version,
    bundled_mod_id: bundled_mod_id,
    bundled_mod_name: bundled_mod_name,
    bundled_mod_description: bundled_mod_description,
    minecraft_version: minecraft_version,
    neoforge_version: neoforge_version,
    flywheel_version: flywheel_version,
    sable_version: sable_version,
    addon_nested_jar_path: "META-INF/jarjar/${mod_id}-${mod_version}.jar",
    library_nested_jar_path: "META-INF/jarjar/${library_mod_id}-${library_mod_version}.jar"
