import groovy.json.JsonSlurper

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = mod_group_id
version = artifact_version

base {
    archivesName = archive_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    maven {
        name = 'Create Maven'
        url = 'https://maven.createmod.net/'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
}

def libsDir = file('libs')
def requiredSableJar = file("libs/sable-neoforge-${minecraft_version}-${sable_version}.jar")
def localJars = fileTree(libsDir) {
    include '*.jar'
    exclude 'sable-neoforge-*.jar'
    exclude "${library_archive_name}-*.jar"
}
def localRuntimeJars = fileTree(libsDir) {
    include '*.jar'
    exclude 'MixinSquared-*.jar'
    exclude 'veil-neoforge-*.jar'
    exclude 'sable-neoforge-*.jar'
    exclude "${library_archive_name}-*.jar"
}
def libraryProjectDir = file(library_project_dir)
def libraryJarFile = new File(libraryProjectDir,
        "build/libs/${library_archive_name}-${artifact_version}.jar")
def addonReplaceProperties = [
    mod_group_id: mod_group_id,
    mod_id: mod_id,
    mod_name: mod_name,
    mod_license: mod_license,
    mod_version: mod_version,
    mod_authors: mod_authors,
    mod_description: mod_description,
    library_mod_id: library_mod_id,
    library_mod_name: library_mod_name,
    bundled_mod_id: bundled_mod_id,
    bundled_mod_name: bundled_mod_name,
    bundled_mod_description: bundled_mod_description,
    minecraft_version: minecraft_version,
    neoforge_version: neoforge_version,
    flywheel_version: flywheel_version,
    sable_version: sable_version
]
def bundledReplaceProperties = [
    mod_group_id: mod_group_id,
    mod_id: mod_id,
    mod_name: mod_name,
    mod_license: mod_license,
    mod_version: mod_version,
    mod_authors: mod_authors,
    mod_description: mod_description,
    library_mod_id: library_mod_id,
    library_mod_name: library_mod_name,
    bundled_mod_id: bundled_mod_id,
    bundled_mod_name: bundled_mod_name,
    bundled_mod_description: bundled_mod_description,
    minecraft_version: minecraft_version,
    neoforge_version: neoforge_version,
    flywheel_version: flywheel_version,
    sable_version: sable_version,
    addon_nested_jar_path: "META-INF/jarjar/${mod_id}-${mod_version}.jar",
    library_nested_jar_path: "META-INF/jarjar/${library_mod_id}-${mod_version}.jar"
]

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = '2024.11.17'
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'mixin.env.remapRefMap', 'true'
            systemProperty 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        client {
            client()
            gameDirectory = file('run/client')
        }

        server {
            server()
            gameDirectory = file('run/server')
        }
    }
}

configurations {
    bundledSqlite {
        transitive = false
    }
}

def buildLibrary = tasks.register('buildLibrary', Exec) {
    group = 'build'
    description = 'Builds the sibling Gadgets & Gizmos Library before compiling or bundling the addon.'
    workingDir libraryProjectDir
    outputs.file(libraryJarFile)
    outputs.upToDateWhen { false }

    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', new File(libraryProjectDir, 'gradlew.bat').absolutePath,
                'clean', 'build',
                "-Pmod_version=${mod_version}",
                "-Partifact_version=${artifact_version}",
                '--no-daemon', '--console=plain'
    } else {
        commandLine new File(libraryProjectDir, 'gradlew').absolutePath,
                'clean', 'build',
                "-Pmod_version=${mod_version}",
                "-Partifact_version=${artifact_version}",
                '--no-daemon', '--console=plain'
    }

    doFirst {
        File wrapper = new File(libraryProjectDir,
                System.getProperty('os.name').toLowerCase().contains('windows') ? 'gradlew.bat' : 'gradlew')
        if (!wrapper.isFile()) {
            throw new GradleException("Missing sibling library Gradle wrapper: ${wrapper}")
        }
    }
    doLast {
        if (!libraryJarFile.isFile()) {
            throw new GradleException("The sibling library build did not produce ${libraryJarFile}")
        }
    }
}

def validateLocalDependencies = tasks.register('validateLocalDependencies') {
    doLast {
        if (!requiredSableJar.isFile()) {
            throw new GradleException("Missing Sable ${sable_version} jar: ${requiredSableJar}")
        }
        if (!libraryProjectDir.isDirectory()) {
            throw new GradleException("Missing sibling library project: ${libraryProjectDir}")
        }
    }
}

def validateMixinConfig = tasks.register('validateMixinConfig') {
    inputs.files(
            fileTree('src/main/java') { include '**/mixin/**/*.java' },
            'src/main/resources/createthrusters-main.mixins.json')
    doLast {
        File sourceRoot = file('src/main/java')
        Map<String, ?> config = new JsonSlurper().parse(
                file('src/main/resources/createthrusters-main.mixins.json')) as Map<String, ?>
        Set<String> declared = (config.getOrDefault('mixins', [])
                + config.getOrDefault('client', [])
                + config.getOrDefault('server', [])) as Set<String>
        List<String> missing = []
        fileTree(sourceRoot) { include '**/mixin/**/*.java' }.each { File source ->
            if (!source.text.contains('@Mixin')) {
                return
            }
            String relative = sourceRoot.toPath().relativize(source.toPath()).toString()
                    .replace('\\', '.')
                    .replace('/', '.')
                    .replaceFirst(/\.java$/, '')
            String prefix = config.package + '.'
            String name = relative.startsWith(prefix) ? relative.substring(prefix.length()) : relative
            if (!declared.contains(name)) {
                missing.add("${project.relativePath(source)} (${name})")
            }
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Mixin classes missing from the addon config:\n" + missing.join('\n'))
        }
    }
}

dependencies {
    bundledSqlite 'org.xerial:sqlite-jdbc:3.46.1.3'
    compileOnly localJars
    compileOnly files(requiredSableJar)
    compileOnly files(libraryJarFile)
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.27.0.340'
    compileOnly 'dev.emi:emi-neoforge:1.1.22+1.21.1'
    compileOnly 'me.shedaniel:RoughlyEnoughItems-api-neoforge:16.0.799'
    compileOnly 'maven.modrinth:jade:15.10.5+neoforge'
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    compileOnly 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1'
    runtimeOnly localRuntimeJars
    runtimeOnly files(requiredSableJar)
    runtimeOnly files(libraryJarFile)
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
}

sourceSets {
    docgen {
        java.srcDir 'src/docgen/java'
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

def ccDocsCatalogue = layout.projectDirectory.file(
        'src/main/resources/data/computercraft/lua/rom/modules/main/'
                + 'gadgetsandgizmos/docs_catalog.lua')

tasks.named('compileDocgenJava') {
    dependsOn tasks.named('classes')
}

tasks.register('generateComputerCraftDocs', JavaExec) {
    group = 'documentation'
    description = 'Regenerates the checked-in CC:Tweaked Lua documentation catalogue.'
    dependsOn tasks.named('docgenClasses')
    classpath = sourceSets.docgen.runtimeClasspath
    mainClass = 'com.rieno.gadgetsandgizmos.tools.GenerateComputerCraftDocs'
    args ccDocsCatalogue.asFile.absolutePath
    outputs.file ccDocsCatalogue
}

tasks.register('verifyComputerCraftDocs', JavaExec) {
    group = 'verification'
    description = 'Fails when CC:Tweaked documentation is missing or stale.'
    dependsOn tasks.named('docgenClasses')
    classpath = sourceSets.docgen.runtimeClasspath
    mainClass = 'com.rieno.gadgetsandgizmos.tools.GenerateComputerCraftDocs'
    args '--check', ccDocsCatalogue.asFile.absolutePath
    inputs.files sourceSets.main.output, sourceSets.docgen.output
    inputs.file ccDocsCatalogue
}

tasks.withType(JavaCompile).configureEach {
    dependsOn buildLibrary
    dependsOn validateLocalDependencies
    options.encoding = 'UTF-8'
}

tasks.named('check') {
    dependsOn validateMixinConfig
    dependsOn tasks.named('verifyComputerCraftDocs')
}

tasks.named('jar', Jar) {
    archiveBaseName = archive_name
}

tasks.register('bundledJar', Jar) {
    group = 'build'
    description = 'Assembles the distribution wrapper with freshly built addon and library jars.'
    archiveBaseName = distribution_name
    archiveVersion = artifact_version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn tasks.named('jar')
    dependsOn buildLibrary
    from('src/bundled/resources') {
        filesMatching(['META-INF/neoforge.mods.toml', 'META-INF/jarjar/metadata.json']) {
            expand bundledReplaceProperties
        }
    }
    from(tasks.named('jar').flatMap { it.archiveFile }) {
        into 'META-INF/jarjar'
        rename { "${mod_id}-${mod_version}.jar" }
    }
    from(libraryJarFile) {
        into 'META-INF/jarjar'
        rename { "${library_mod_id}-${mod_version}.jar" }
    }
}

tasks.register('copyBundledJarToModrinth') {
    group = 'build'
    description = 'Copies the bundled jar into the Modrinth Create addon dev profile mods directory.'
    dependsOn tasks.named('bundledJar')
    def modrinthModsDir = file('C:/Users/Rieno/AppData/Roaming/ModrinthApp/profiles/Create addon dev/mods')
    inputs.file(tasks.named('bundledJar').flatMap { it.archiveFile })
    outputs.file(modrinthModsDir.toPath().resolve(tasks.named('bundledJar').get().archiveFileName.get()).toFile())
    doLast {
        modrinthModsDir.mkdirs()
        fileTree(modrinthModsDir) {
            include "${archive_name}-*.jar"
            include "${distribution_name}-*.jar"
        }.each { File staleJar ->
            if (!staleJar.name.equals(tasks.named('bundledJar').get().archiveFileName.get())) {
                staleJar.delete()
            }
        }

        File sourceJar = tasks.named('bundledJar').get().archiveFile.get().asFile
        File targetJar = new File(modrinthModsDir, tasks.named('bundledJar').get().archiveFileName.get())
        File tempJar = new File(modrinthModsDir, "${targetJar.name}.tmp")
        try {
            java.nio.file.Files.copy(sourceJar.toPath(), tempJar.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            try {
                java.nio.file.Files.move(tempJar.toPath(), targetJar.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING,
                        java.nio.file.StandardCopyOption.ATOMIC_MOVE)
            } catch (java.nio.file.AtomicMoveNotSupportedException ignored) {
                java.nio.file.Files.move(tempJar.toPath(), targetJar.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        } catch (java.nio.file.AccessDeniedException lockedJar) {
            tempJar.delete()
            logger.warn("Could not update locked Modrinth profile jar '{}'. "
                    + "The built artifact is still available at '{}'.",
                    targetJar, sourceJar)
        }
    }
}

tasks.named('build') {
    dependsOn tasks.named('bundledJar')
}

processResources {
    inputs.properties addonReplaceProperties
    inputs.files(configurations.bundledSqlite)
    from(configurations.bundledSqlite) {
        into 'META-INF/optional-libs'
        rename { 'sqlite-jdbc-bundled.jar' }
    }
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand addonReplaceProperties
    }
}
