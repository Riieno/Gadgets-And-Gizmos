                def world = new File(validationDir, 'saves/Widget Shaders')
                if(!new File(world, 'level.dat').isFile()){
                    copy { from 'run/acc-presentation-tests/world'; include 'level.dat'; into world }
                }
                def pack = new File(instanceDir, "shaderpacks/${shaderPack}")
                if(!pack.exists()) throw new GradleException("Shader pack does not exist: ${pack}")
                copy {
                    from pack
                    into pack.isDirectory() ? new File(validationDir, "shaderpacks/${shaderPack}") : new File(validationDir, 'shaderpacks')
                }
                def configDir = new File(validationDir, 'config'); configDir.mkdirs()
                new File(configDir, 'iris.properties').text = "enableShaders=true\nshaderPack=${shaderPack}\ndisableUpdateMessage=true\n"
