def selectedLocalJars = propulsionNightlyJar.isFile()
        ? localJars.minus(files(propulsionReleaseJar)) : localJars
def selectedLocalRuntimeJars = propulsionNightlyJar.isFile()
        ? localRuntimeJars.minus(files(propulsionReleaseJar)) : localRuntimeJars
if(providers.gradleProperty('flight_control_validation').map { it.toBoolean() }.getOrElse(false)
        || providers.gradleProperty('acc_presentation_validation').map { it.toBoolean() }.getOrElse(false)) {
    selectedLocalRuntimeJars = selectedLocalRuntimeJars.filter { jar ->
        jar.name.startsWith('architectury-') || jar.name.startsWith('create-')
                || jar.name.startsWith('dev.simulated_team.simulated.simulated-')
                || jar.name.startsWith('dev.eriksonn.aeronautics.aeronautics-')
                || jar.name.startsWith('sable-companion-') || jar.name.startsWith('kotlinforforge-')
                || jar.name.startsWith('accessories-') || jar.name.startsWith('owo-lib-')
    }
}
def libraryProjectDir = file(library_project_dir)
def librarySourceDir = new File(libraryProjectDir, 'src')
def librarySourceAvailable = librarySourceDir.isDirectory()
def siblingLibraryJarFile = new File(libraryProjectDir,
        "build/libs/${library_archive_name}-${library_artifact_version}.jar")
def fallbackLibraryJars = fileTree(libsDir) {
    include "${library_archive_name}-*.jar"
    exclude '*-sources.jar'
    exclude '*-javadoc.jar'
}.files.sort { first, second -> first.name <=> second.name }
def fallbackLibraryJar = fallbackLibraryJars.find {
    it.name == "${library_archive_name}-${library_artifact_version}.jar"
} ?: fallbackLibraryJars.find()
def libraryJarFile = librarySourceAvailable
        ? siblingLibraryJarFile
        : fallbackLibraryJar ?: new File(libsDir, "${library_archive_name}-${library_artifact_version}.jar")
