            dependsOn prepareWidgetShaders, tasks.named('accPresentationTestClasses')
            systemProperty 'gadgetsngizmos.widgetShaderValidation', validationDir.absolutePath
            args '--quickPlaySingleplayer', 'Widget Shaders', '--width', '960', '--height', '540'
