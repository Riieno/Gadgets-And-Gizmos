import groovy.json.JsonSlurper
import groovy.json.JsonOutput

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = mod_group_id
version = artifact_version

base {
    archivesName = archive_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    maven {
        name = 'Create Maven'
        url = 'https://maven.createmod.net/'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
}

def libsDir = file('libs')
def powerGridJar = providers.gradleProperty('powergrid_jar')
        .orElse('G:/Minecraft/Instances/Addon Dev/mods/powergrid-mc1.21.1-0.6.2.jar')

// Prefer an explicit compatibility jar, then local dependencies, then the development instance
def letItWalkJar = providers.gradleProperty('let_it_walk_jar')
        .orElse(providers.provider {
            def candidates = [libsDir, file('G:/Minecraft/Instances/Addon Dev/mods')].collect { dir ->
                fileTree(dir) {
                    include 'let_it_walk*.jar'
                    exclude '*-sources.jar', '*-javadoc.jar'
                }.files
            }.find { !it.isEmpty() } ?: []
            if(candidates.size() > 1){
                throw new GradleException('Multiple Let It Walk jars found. Select one with -Plet_it_walk_jar=<path>.')
            }
            return candidates.isEmpty() ? new File(libsDir, 'let_it_walk.jar').absolutePath : candidates.first().absolutePath
        })

// Resolve the compatibility ABI without requiring Flight Control in a local Minecraft instance
// act82pgK is the NeoForge 1.21.1 release of Flight Control 0.7.7
def flightControlDependency = 'maven.modrinth:IGVrnkhH:act82pgK'
def flightControlJar = providers.gradleProperty('flight_control_jar')
def requiredSableJar = file("libs/sable-neoforge-${minecraft_version}-${sable_version}.jar")
def propulsionNightlyJar = file('libs/createpropulsion-nightly-1.1.5-c89a53e7.jar')
def propulsionReleaseJar = file('libs/createpropulsion-1.1.5.jar')
def localJars = fileTree(libsDir) {
    include '*.jar'
    exclude 'aeroclaims-*.jar', 'open-parties-and-claims-*.jar'
    exclude 'create_flight_control-*.jar'
    exclude 'sable-neoforge-*.jar'
    exclude "${library_archive_name}-*.jar"
}
def localRuntimeJars = fileTree(libsDir) {
    include '*.jar'
    exclude 'aeroclaims-*.jar', 'open-parties-and-claims-*.jar'
    exclude 'MixinSquared-*.jar'
    exclude 'veil-neoforge-*.jar'
    exclude 'sable-neoforge-*.jar'
    exclude "${library_archive_name}-*.jar"
}
def selectedLocalJars = propulsionNightlyJar.isFile()
        ? localJars.minus(files(propulsionReleaseJar)) : localJars
def selectedLocalRuntimeJars = propulsionNightlyJar.isFile()
        ? localRuntimeJars.minus(files(propulsionReleaseJar)) : localRuntimeJars
// Validate native CC compatibility against a selected local version without replacing dependency jars
if(providers.gradleProperty('computercraft_jar').isPresent()){
    def selectedComputerCraftJar = files(providers.gradleProperty('computercraft_jar').get())
    selectedLocalJars = selectedLocalJars.filter { !it.name.startsWith('cc-tweaked-') }.plus(selectedComputerCraftJar)
    selectedLocalRuntimeJars = selectedLocalRuntimeJars.filter { !it.name.startsWith('cc-tweaked-') }.plus(selectedComputerCraftJar)
}
def libraryProjectDir = file(library_project_dir)
def librarySourceDir = new File(libraryProjectDir, 'src')
def librarySourceAvailable = librarySourceDir.isDirectory()
def siblingLibraryJarFile = new File(libraryProjectDir,
        "build/libs/${library_archive_name}-${library_artifact_version}.jar")
def fallbackLibraryJars = fileTree(libsDir) {
    include "${library_archive_name}-*.jar"
    exclude '*-sources.jar'
    exclude '*-javadoc.jar'
}.files.sort { first, second -> first.name <=> second.name }
def fallbackLibraryJar = fallbackLibraryJars.find {
    it.name == "${library_archive_name}-${library_artifact_version}.jar"
} ?: fallbackLibraryJars.find()
def libraryJarFile = librarySourceAvailable
        ? siblingLibraryJarFile
        : fallbackLibraryJar ?: new File(libsDir, "${library_archive_name}-${library_artifact_version}.jar")
def addonReplaceProperties = [
    mod_group_id: mod_group_id,
    mod_id: mod_id,
    mod_name: mod_name,
    mod_license: mod_license,
    mod_version: mod_version,
    mod_authors: mod_authors,
    mod_description: mod_description,
    library_mod_id: library_mod_id,
    library_mod_name: library_mod_name,
    library_mod_version: library_mod_version,
    bundled_mod_id: bundled_mod_id,
    bundled_mod_name: bundled_mod_name,
    bundled_mod_description: bundled_mod_description,
    minecraft_version: minecraft_version,
    neoforge_version: neoforge_version,
    flywheel_version: flywheel_version,
    sable_version: sable_version
]
def bundledReplaceProperties = [
    mod_group_id: mod_group_id,
    mod_id: mod_id,
    mod_name: mod_name,
    mod_license: mod_license,
    mod_version: mod_version,
    mod_authors: mod_authors,
    mod_description: mod_description,
    library_mod_id: library_mod_id,
    library_mod_name: library_mod_name,
    library_mod_version: library_mod_version,
    bundled_mod_id: bundled_mod_id,
    bundled_mod_name: bundled_mod_name,
    bundled_mod_description: bundled_mod_description,
    minecraft_version: minecraft_version,
    neoforge_version: neoforge_version,
    flywheel_version: flywheel_version,
    sable_version: sable_version,
    addon_nested_jar_path: "META-INF/jarjar/${mod_id}-${mod_version}.jar",
    library_nested_jar_path: "META-INF/jarjar/${library_mod_id}-${library_mod_version}.jar"
]

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = '2024.11.17'
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'mixin.env.remapRefMap', 'true'
            systemProperty 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        client {
            client()
            gameDirectory = file('run/client')
        }

        server {
            server()
            gameDirectory = file('run/server')
        }
    }
}

configurations {
    bundledSqlite {
        transitive = false
    }
}

def buildLibrary = tasks.register('buildLibrary', Exec) {
    group = 'build'
    description = 'Builds the sibling Gadgets & Gizmos Library when its source is available.'
    workingDir libraryProjectDir
    outputs.file(siblingLibraryJarFile)
    inputs.files(fileTree(new File(libraryProjectDir, 'src')),
            new File(libraryProjectDir, 'build.gradle'), new File(libraryProjectDir, 'settings.gradle'),
            new File(libraryProjectDir, 'gradle.properties'), new File(libraryProjectDir, 'gradlew'),
            new File(libraryProjectDir, 'gradlew.bat'), fileTree(new File(libraryProjectDir, 'gradle')),
            fileTree(new File(libraryProjectDir, 'libs')))
    inputs.properties(libraryModVersion: library_mod_version, libraryArtifactVersion: library_artifact_version)
    onlyIf { librarySourceAvailable }

    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', new File(libraryProjectDir, 'gradlew.bat').absolutePath,
                'build',
                "-Pmod_version=${library_mod_version}",
                "-Partifact_version=${library_artifact_version}",
                '--console=plain'
    } else {
        commandLine new File(libraryProjectDir, 'gradlew').absolutePath,
                'build',
                "-Pmod_version=${library_mod_version}",
                "-Partifact_version=${library_artifact_version}",
                '--console=plain'
    }

    doFirst {
        File wrapper = new File(libraryProjectDir,
                System.getProperty('os.name').toLowerCase().contains('windows') ? 'gradlew.bat' : 'gradlew')
        if (!wrapper.isFile()) {
            throw new GradleException("Missing sibling library Gradle wrapper: ${wrapper}")
        }
    }
    doLast {
        if (!siblingLibraryJarFile.isFile()) {
            throw new GradleException("The sibling library build did not produce ${siblingLibraryJarFile}")
        }
    }
}

def validateLocalDependencies = tasks.register('validateLocalDependencies') {
    doLast {
        if (!requiredSableJar.isFile()) {
            throw new GradleException("Missing Sable ${sable_version} jar: ${requiredSableJar}")
        }
        if(!file(letItWalkJar.get()).isFile()){
            throw new GradleException("Missing Let It Walk compile dependency: ${letItWalkJar.get()}. "
                    + 'Place its jar in libs or set -Plet_it_walk_jar=<path>.')
        }
        if (!librarySourceAvailable && !libraryJarFile.isFile()) {
            throw new GradleException("Missing library source directory ${librarySourceDir} and fallback library jar ${libraryJarFile}")
        }
    }
}

def validateMixinConfig = tasks.register('validateMixinConfig') {
    inputs.files(
            fileTree('src/main/java') { include '**/mixin/**/*.java' },
            'src/main/resources/createthrusters-main.mixins.json')
    doLast {
        File sourceRoot = file('src/main/java')
        Map<String, ?> config = new JsonSlurper().parse(
                file('src/main/resources/createthrusters-main.mixins.json')) as Map<String, ?>
        Set<String> declared = (config.getOrDefault('mixins', [])
                + config.getOrDefault('client', [])
                + config.getOrDefault('server', [])) as Set<String>
        List<String> missing = []
        fileTree(sourceRoot) { include '**/mixin/**/*.java' }.each { File source ->
            if (!source.text.contains('@Mixin')) {
                return
            }
            String relative = sourceRoot.toPath().relativize(source.toPath()).toString()
                    .replace('\\', '.')
                    .replace('/', '.')
                    .replaceFirst(/\.java$/, '')
            String prefix = config.package + '.'
            String name = relative.startsWith(prefix) ? relative.substring(prefix.length()) : relative
            if (!declared.contains(name)) {
                missing.add("${project.relativePath(source)} (${name})")
            }
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Mixin classes missing from the addon config:\n" + missing.join('\n'))
        }
    }
}

dependencies {
    if(providers.gradleProperty('simulated_coasters_jar').isPresent()){
        runtimeOnly files(providers.gradleProperty('simulated_coasters_jar').get())
    }
    compileOnly files(letItWalkJar)
    compileOnly files(powerGridJar)
    bundledSqlite 'org.xerial:sqlite-jdbc:3.46.1.3'
    compileOnly selectedLocalJars
    compileOnly fileTree(libsDir) { include 'aeroclaims-*.jar' }
    compileOnly files(selectedLocalJars.files.findAll { it.name.startsWith('create-') }.collect { jar ->
        zipTree(jar).matching { include 'META-INF/jarjar/Registrate-*.jar' }
    })
    if(flightControlJar.isPresent()){
        compileOnly files(flightControlJar.get())
    }else{
        compileOnly(flightControlDependency) { transitive = false }
    }
    if(providers.gradleProperty('flight_control_runtime').map { it.toBoolean() }.getOrElse(false)){
        if(flightControlJar.isPresent()) runtimeOnly files(flightControlJar.get())
        else runtimeOnly(flightControlDependency) { transitive = false }
    }
    compileOnly files(requiredSableJar)
    compileOnly files(libraryJarFile)
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.27.0.340'
    compileOnly 'dev.emi:emi-neoforge:1.1.22+1.21.1'
    compileOnly 'me.shedaniel:RoughlyEnoughItems-api-neoforge:16.0.799'
    compileOnly 'maven.modrinth:jade:15.10.5+neoforge'
    compileOnly 'maven.modrinth:B1CBVXHX:eFcwlxhy'
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    compileOnly 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1'
    compileOnly('org.appliedenergistics:appliedenergistics2:19.2.17') { transitive = false }
    runtimeOnly selectedLocalRuntimeJars
    runtimeOnly files(requiredSableJar)
    runtimeOnly files(libraryJarFile)
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
}

sourceSets {
    docgen {
        java.srcDir 'src/docgen/java'
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

def ccDocsCatalogue = layout.projectDirectory.file(
        'src/main/resources/data/computercraft/lua/rom/modules/main/'
                + 'gadgetsandgizmos/docs_catalog.lua')

tasks.named('compileDocgenJava') {
    dependsOn tasks.named('classes')
}

// Expose nested runtime libraries to the standalone documentation exporter
def documentationLibraries = layout.buildDirectory.dir('documentation-libraries')
tasks.register('prepareDocumentationLibraries', Copy) {
    if(librarySourceAvailable) dependsOn buildLibrary
    from zipTree(localJars.find { it.name.startsWith("create-${minecraft_version}-") })
    from({ zipTree(libraryJarFile) })
    include 'META-INF/jarjar/*.jar'
    into documentationLibraries
}

tasks.register('generateGraphWebCatalog', JavaExec) {
    group = 'documentation'
    description = 'Exports resolved graph nodes and the library browser API for the website.'
    dependsOn tasks.named('docgenClasses')
    dependsOn tasks.named('prepareDocumentationLibraries')
    classpath = sourceSets.docgen.runtimeClasspath + sourceSets.main.runtimeClasspath + fileTree(documentationLibraries) { include '**/*.jar' }
    mainClass = 'com.rieno.gadgetsandgizmos.neoforge.GenerateGraphWebCatalog'
    args providers.gradleProperty('web_catalog_output').getOrElse(
            layout.buildDirectory.dir('generated/graph-web-catalog').get().asFile.absolutePath)
}

tasks.register('generateComputerCraftDocs', JavaExec) {
    group = 'documentation'
    description = 'Regenerates the checked-in CC:Tweaked Lua documentation catalogue.'
    dependsOn tasks.named('docgenClasses')
    classpath = sourceSets.docgen.runtimeClasspath
    mainClass = 'com.rieno.gadgetsandgizmos.tools.GenerateComputerCraftDocs'
    args ccDocsCatalogue.asFile.absolutePath
    outputs.file ccDocsCatalogue
}

tasks.withType(JavaCompile).configureEach {
    if (librarySourceAvailable) {
        dependsOn buildLibrary
    }
    dependsOn validateLocalDependencies
    options.encoding = 'UTF-8'
}

tasks.named('check') {
    dependsOn validateMixinConfig
}

tasks.named('jar', Jar) {
    archiveBaseName = archive_name
}

tasks.register('bundledJar', Jar) {
    group = 'build'
    description = 'Assembles the distribution wrapper with freshly built addon and library jars.'
    archiveBaseName = distribution_name
    archiveVersion = artifact_version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn tasks.named('jar')
    if (librarySourceAvailable) {
        dependsOn buildLibrary
    }
    from('src/bundled/resources') {
        filesMatching(['META-INF/neoforge.mods.toml', 'META-INF/jarjar/metadata.json']) {
            expand bundledReplaceProperties
        }
    }
    from(tasks.named('jar').flatMap { it.archiveFile }) {
        into 'META-INF/jarjar'
        rename { "${mod_id}-${mod_version}.jar" }
    }
    from(libraryJarFile) {
        into 'META-INF/jarjar'
        rename { "${library_mod_id}-${library_mod_version}.jar" }
    }
}
tasks.named('build') {
    dependsOn tasks.named('bundledJar')
}

// Package the checked-in wiki snapshot with this addon version without any network access
def wikiBundleDir = layout.buildDirectory.dir('generated/bundled-wiki')
def bundleWikiDocumentation = tasks.register('bundleWikiDocumentation', Sync) {
    from('src/main/wiki')
    include '**/*.md', 'images/**'
    into wikiBundleDir
    inputs.property('documentationVersion', mod_version)
    doLast {
        def pages = fileTree('src/main/wiki') { include '*.md' }.files.collect { source ->
            def id = source.name.substring(0, source.name.length() - 3)
            [id: id, title: id.replace('-', ' ').replace('_', ' '), file: source.name]
        }.sort { first, second ->
            (first.id == 'Home' ? 0 : 1) <=> (second.id == 'Home' ? 0 : 1) ?: first.title.compareToIgnoreCase(second.title)
        }
        new File(wikiBundleDir.get().asFile, 'index.json').setText(JsonOutput.prettyPrint(JsonOutput.toJson(
                [formatVersion: 1, version: mod_version, pages: pages])), 'UTF-8')
    }
}

processResources {
    exclude 'assets/createthrusters/web/graph-editor/**'
    dependsOn bundleWikiDocumentation
    from(wikiBundleDir) { into 'assets/createthrusters/documentation' }
    inputs.properties addonReplaceProperties
    inputs.files(configurations.bundledSqlite)
    from(configurations.bundledSqlite) {
        into 'META-INF/optional-libs'
        rename { 'sqlite-jdbc-bundled.jar' }
    }
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand addonReplaceProperties
    }
    // Package the supplied 3D artwork with a valid Minecraft resource path
    filesMatching('assets/createthrusters/textures/gui/modals/target_modal_3D.png') {
        name = 'target_modal_3d.png'
    }
}
