    compileOnly selectedLocalJars
    compileOnly fileTree(libsDir) { include 'aeroclaims-*.jar' }
    compileOnly files(selectedLocalJars.files.findAll { it.name.startsWith('create-') }.collect { jar ->
        zipTree(jar).matching { include 'META-INF/jarjar/Registrate-*.jar' }
    })
    if(flightControlJar.isPresent()){
        compileOnly files(flightControlJar.get())
    }else{
